<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Plogging au Sart Tilman - Green Team CHU(U)Liège
    </title>
    <script src ="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
	<script src="https://unpkg.com/leaflet-providers@latest/leaflet-providers.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/1.4.3/Control.FullScreen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style type="text/css">
      #map { height : 800px; width : 100%}
      .info { padding: 10px 20px; font: 20px/22px Arial, Helvetica, sans-serif; background: rgba(255,255,255,0.7);
        box-shadow: 0 0 15px rgba(0,0,0,0.4); border-radius: 7px; }
          .info h4 { margin: 0 0 5px; color: #777; }
      .legend { text-align: left; line-height: 18px; color: #555; }
      .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
      .hexbin-hexagon {
        stroke: #000;
        stroke-width: .5px;
      }
      .line{
        width: 10px;
        height: 10px;
        color: red
      }

    </style>
  </head>
  <body>

    <div id="map"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js" integrity="sha512-KhIBJeCI4oTEeqOmRi2gDJ7m+JARImhUYgXWiOTIp9qqySpFUAJs09erGKem4E5IPuxxSTjavuurvBitBmwE0w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js" integrity="sha512-55AYz+N6WyuiC8bRpQftNyCcSBCl3AEutoTsb4EeZuFVFP1+G4gll30iczAvvTpdL9nz48F7ZFEUavRUXp3FNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/1.4.3/Control.FullScreen.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-providers/1.13.0/leaflet-providers.min.js" integrity="sha512-5EYsvqNbFZ8HX60keFbe56Wr0Mq5J1RrA0KdVcfGDhnjnzIRsDrT/S3cxdzpVN2NGxAB9omgqnlh4/06TvWCMw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js" type="text/javascript" ></script>
	<script src="/js/moves.js" type="text/javascript"></script>
    <script>
	
	//let path = require('path');
	var gpxdir = '/gpx/plogging/'
	var currentTime = new Date()
	var thisyear = currentTime.getFullYear()
	var colorlist = ["red", "#00ffed", "#ff9500", "blue", "green", "yellow", ]

	var movedates = {
		"20260921": ["charles","joel","marc","tommaso","christophe"],
		"20261013": ["charles"],
	};

	var map = L.map('map', {fullscreenControl: true}).setView([50.58,5.57], 15);

	map.createPane("casing");
	map.getPane("casing").style.zIndex = 399;
	
	var baseMaps = {
		"OpenStreetMap": L.tileLayer.provider('OpenStreetMap.Mapnik'),
		//"Stadia Outdoors": L.tileLayer.provider('Stadia.Outdoors'),
		"ESRI World Imagery": L.tileLayer.provider('Esri.WorldImagery'),
		//"Stadia.AlidadeSmoothDark": L.tileLayer.provider('Stadia.AlidadeSmoothDark'),
		};

	L.tileLayer.provider("OpenStreetMap.Mapnik").addTo(map);

	var pneus = L.marker([50.568029, 5.559511]).addTo(map);
    var dechets = L.marker([50.567300, 5.563618]).addTo(map);
	var dechets2 = L.marker([50.578750, 5.572214]).addTo(map);
    var pointsNoirs = L.layerGroup([pneus, dechets,dechets2]);
        
    var linecolor = "#964bff"

	var heatStyle = {
	gradient : {.7: "white", .8:"#FFFF36", .9:"#FF9D00", 1:"#FF1700"},
	minOpacity: 0.75,
	radius: 7,
	blur: 7,
	};

	var latlon = [];

	var onEachFeature = function (feature, layer) {
		coords = feature.geometry.coordinates;
		for ( var i=0; i < coords.length; ++i ){
			latlon.push(L.latLng(coords[i][1], coords[i][0]));
		}	
	};

	function addGpx(file, color) {
	var main = omnivore.gpx(file, null, L.geoJson(null, {
		style: function () {
		return { color: color, weight: 2, opacity: 1, dashArray: '5,10'};
		},
		onEachFeature: onEachFeature   // collects heatmap coords once
	})).addTo(map);

	main.on("ready", function () {
		L.geoJson(main.toGeoJSON(), {
		pane: "casing",
		style: function () {
			return { color: "white", weight: 4, opacity: 0.75 };
		}
		}).addTo(map);
	});

		return main;
	}
	
	// Loop on the different dates
	for (const dates of Object.keys(movedates)) {
		console.log("Working on date " +  dates)
		// Loop on the runners for that date
		console.log(movedates[dates]);
		nMoves = movedates[dates].length;
		console.log(nMoves);
		for (var i = 0; i < nMoves ; i++) {
			mylinecolor = "red";
			gpxfile = gpxdir + dates + "/" + movedates[dates][i] + ".gpx";
			addGpx(gpxfile, "red");
		}
	};

	var heatmap = L.heatLayer(latlon, heatStyle);
	heatlayer = L.layerGroup(heatmap);
	heatlayer.addTo(map);

	var overlayers = {
		"🔥 Heat map ": heatmap,
		"🗑️ Dépôts sauvages": pointsNoirs,
	};

	L.control.scale().addTo(map);
	L.control.layers(baseMaps, overlayers, {autoZIndex:true, collapsed:false}).addTo(map);

    </script>

  </body>
</html>
